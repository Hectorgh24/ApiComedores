<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear desayuno o comida</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/material.css">
</head>
<body>
    <div class="container">
        <h1>Crear desayuno o comida</h1>
        
        <a href="index.html" class="nav-link">← Volver al menú principal</a>
        
        <div class="card">
            <form id="formDesayunoComida">
                <h2>Formulario para crear desayuno o comida</h2>
                
                <div class="form-group">
                    <label for="tipo">Tipo:</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Selecciona el tipo</option>
                        <option value="desayuno">Desayuno</option>
                        <option value="comida">Comida</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
                
                <div class="form-group">
                    <label for="descripcion">Descripción:</label>
                    <input type="text" id="descripcion" name="descripcion" rows="4" placeholder="Ej: Chilaquiles, café, fruta y pan dulce" required>
                </div>
                
                <div class="form-group">
                    <label for="img_url">URL de la imagen:</label>
                    <input type="url" id="img_url" name="img_url" placeholder="https://ejemplo.com/imagenes/imagen.jpg" required>
                    <div id="preview-imagen" class="preview-container"></div>
                </div>
                
                <button type="submit" class="btn btn-primary">Crear Desayuno/Comida</button>
            </form>
        </div>
        
        <div id="resultado" class="card" style="display: none;"></div>
    </div>
    
    <script src="js/crear-desayuno-comida.js"></script>
</body>
</html>
